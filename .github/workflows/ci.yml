name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-files | wc -l | tr -d ' ')" -gt 0
          test -z "$(git status --porcelain)"
          git rev-parse --verify 'HEAD^{commit}' >/dev/null
